name: Build portable Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - HYSPLIT_Batch.spec
      - build_windows_exe.ps1
      - .github/workflows/build-portable-windows.yml

permissions:
  contents: read

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: "x64"

      - name: Install Windows packaging dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-era5.txt "pyinstaller>=6.11,<7"

      - name: Compile standalone EXE and validate packaged imports
        shell: pwsh
        run: |
          ./build_windows_exe.ps1 -Python (Get-Command python).Source

      - name: Upload ZIP for installation on other Windows PCs
        uses: actions/upload-artifact@v4
        with:
          name: HYSPLIT_Batch_Windows_x64
          path: releases/HYSPLIT_Batch_Windows_x64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

